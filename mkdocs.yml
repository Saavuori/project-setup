site_name: One Host, Many Apps
site_description: Hosting several web apps on one free Oracle Cloud ARM machine, with automatic HTTPS and push-to-deploy.
site_author: Sampsa Säävuori
site_url: https://saavuori.github.io/project-setup/
repo_url: https://github.com/Saavuori/project-setup
repo_name: Saavuori/project-setup
edit_uri: edit/main/docs/
copyright: © 2026 Sampsa Säävuori · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>

nav:
  - Home: index.md
  - Guide: guide.md
  - Glossary: glossary.md

theme:
  name: material
  language: en
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Follow system theme
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.tooltips
    - search.highlight

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

validation:
  links:
    not_found: warn
    anchors: warn
